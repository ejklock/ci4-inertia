name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Decide whether the change touches more than docs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=$(git diff --name-only "$BASE" HEAD | node scripts/code-changed.mjs)
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 --config .github/zizmor.yml .github/
      - run: node --test scripts/*.test.mjs

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        dependencies: [lowest, highest]
        include:
          - php: "8.2"
            drop-dev-packages: infection/infection
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-deps
        with:
          php-version: ${{ matrix.php }}
          dependency-versions: ${{ matrix.dependencies }}
          drop-dev-packages: ${{ matrix.drop-dev-packages }}
      - run: composer test

  quality:
    name: Static analysis, coverage and mutation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-deps
        with:
          php-version: "8.4"
          dependency-versions: highest
          coverage: xdebug
      - run: composer audit --abandoned=fail
      - run: composer analyze
      - run: composer analyze:taint
      - run: composer cs
      - run: composer test:ini-variants
      - run: composer test:coverage-gate
      - run: composer mutation
